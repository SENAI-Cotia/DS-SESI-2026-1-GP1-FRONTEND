<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/assets/icons/icone-aba.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>EasyStock</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    
    <nav>
        <!-- Logo -->
        <img class="logo"    src="../assets/icons/logo.svg" alt="Logo EasyStock">
        <!-- barra de opções -->

        
        <ul>
            <li>
                <img src="../assets/icons/dashboard-icone.svg" alt="dashboard">
                <a href="home.html">Dashboard</a>
            </li>
            <li>
                <img src="../assets/icons/produtos-icon.svg" alt="produtos">
                <a href="produtos.html">Produtos</a>
            </li>
            <li>
                <img src="../assets/icons/Estoque-icon.svg" alt="estoque">
                <a href="estoque.html">Estoque</a>
            </li>
            
        </ul>

    </nav>
    <main> 
    
        <!-- Parte do  perfil   -->
        <section >
            <div class="navPerfil">
                <a href="/pages/perfil.html">
                    <img src="/assets/icons/icone-user-verde.svg" alt="usuario">
                </a>

                <p id="nav-nome"></p>
                

                <div>
                    <img src="/assets/icons/icone-notificacoes.svg" alt="">
                    <img src="/assets/icons/icone-sair-verde.svg" alt="" onclick="sair()">
                </div>
            </div>
            <hr>
        </section>
        <section class="container-cadastro">
            <a href="../pages/gerentes.html"><img src="../assets/icons/voltar.svg" alt=""></a>
            <div class="cadastro-title">
                    <h1>Cadastro de usuários</h1>
                    <p>Insira as informações do gerente abaixo!</p>
            </div>

            <form id="container-label-cadastro">
                <div class="linha-cadastro">
                    <div>
                        <label for="codigo">Nome:</label><br>
                        <input type="text" id="nome">
                    </div>

                    <div>
                        <label for="nome">Email:</label><br>
                        <input type="text" id="email">
                    </div>
                </div>

                <div class="linha-cadastro">
                    <div>
                        <label for="categoria">Função(role):</label><br>
                        <select name="funçoes" id="roles">
                            <option value="admin">Adiministrador</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="filial">Filial:</label><br>
                        <input type="number" id="filial" min="0" max="3">
                    </div>
                </div>

                <div class="linha-cadastro">
                    <div>
                        <label for="url">URL da imagem de perfil:</label><br>
                        <input type="text" id="url">
                    </div>

                    <div>
                        <label for="senha">Crie a senha do usuário:</label><br>
                        <input type="password" id="senha">
                    </div>
                </div>

            
            <div class="btn-add-produto">
                <button type="submit">Adicionar Perfil</button>
            </div>
         </form>
        </section>
    </main>
    <script src="../js/cadastroADM.js"></script>
  
</body>
</html>
