<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" href="/assets/icons/icone-aba.svg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>EasyStock</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <nav>
        <!-- Logo -->
        <img class="logo"    src="../assets/icons/logo.svg" alt="Logo EasyStock">
        <!-- barra de opções -->

        
        <ul>
            <li>
                <img src="../assets/icons/dashboard-icone.svg" alt="dashboard">
                <a href="home.html">Dashboard</a>
            </li >
            <li class="ativo">
                <img src="../assets/icons/produtos-icon.svg" alt="produtos">
                <a href="produtos.html">Produtos</a>
            </li>
            <li>
                <img src="../assets/icons/Estoque-icon.svg" alt="estoque">
                <a href="estoque.html">Estoque</a>
            </li>
        </ul>


    </nav>
    <main> 
    
        <!-- Parte do  perfil   -->
        <section >
            <div class="navPerfil">
                <a href="../pages/perfil.html">
                    <img src="../assets/icons/icone-user-verde.svg" alt="usuario">
                </a>

                <p id="nav-nome"></p>
                

                <div>
                    <img src="../assets/icons/icone-notificacoes.svg" alt="">
                    <img src="../assets/icons/icone-sair-verde.svg" alt="" onclick="sair()">
                </div>
            </div>
            <hr>
        </section>

        <!-- Parte do Cadastro -->

        <section class="container-cadastro">
            <a href="../pages/produtos.html"><img src="../assets/icons/voltar.svg" alt=""></a>
            <div class="cadastro-title">
                    <h1>Cadastro de novo produto</h1>
                    <p>Insira as informações do produto abaixo!</p>
            </div>

            <form id="container-label-cadastro">
                <div class="linha-cadastro">
                    <div>
                        <label for="codigo">Código do produto:</label><br>
                        <input type="text" id="codigo">
                    </div>

                    <div>
                        <label for="nome">Nome do produto:</label><br>
                        <input type="text" id="nome">
                    </div>
                </div>

                <div class="linha-cadastro">
                    <div>
                        <label for="categoria">Categoria:</label><br>
                        <input type="text" id="categoria">
                    </div>
                    <div>
                        <label for="estoque">Estoque</label><br>
                        <input type="number" id="estoque"  min="0" />
                    </div>
                </div>

                <div class="linha-cadastro">
                    <div>
                        <label for="venda">Valor de venda:</label><br>
                        <input type="number" id="venda" min="0" max="10000">
                    </div>

                    <div>
                        <label for="filial">Filial:</label><br>
                        <input type="number" id="filial" min="0" max="10">
                    </div>

                </div>

                
                <div class="linha-cadastro">
                    <div>
                        <label for="url">URL da imagem do produto:</label><br>
                        <input type="text" id="url">
                    </div>

                    <div>
                        <label for="descricao">Descrição</label><br>
                        <textarea name="descrição" id="descricao"></textarea>
                    </div>
                </div>
                
            </div>
            <div class="btn-add-produto">
                <button type="submit">Adicionar Produto</button>
            </div>

        </section>
    </main>
    
</body>
<script src="../js/cadastroProdutos.js"></script>
</html>
